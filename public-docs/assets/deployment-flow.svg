<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">LandingForge deployment setup</title>
  <desc id="desc">Manual environment setup, database configuration and migrations, build and verification, then deployment to a compatible Next.js host. This is not client export automation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#62736b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#152820}.title{font-size:38px;font-weight:700}.sub{font-size:17px;fill:#53665c}.head{font-size:20px;font-weight:700}.body{font-size:15px;fill:#34483d}.small{font-size:14px;fill:#53665c}.box{fill:#fff;stroke:#bdcbc2;stroke-width:2}.green{fill:#e4f1e9;stroke:#91b8a0;stroke-width:2}.gold{fill:#f8f0d9;stroke:#d5bd77;stroke-width:2}.line{stroke:#62736b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="760" rx="28" fill="#f5f7f4"/><text x="72" y="82" class="title">A deployment is configured per environment</text><text x="74" y="117" class="sub">Current setup guidance · verify host-specific steps before release</text>
  <rect x="72" y="254" width="245" height="152" rx="18" class="box"/><text x="106" y="306" class="head">Get source</text><text x="106" y="345" class="body">Install dependencies</text><text x="106" y="374" class="body">Review public allowlist</text>
  <rect x="377" y="254" width="245" height="152" rx="18" class="green"/><text x="411" y="306" class="head">Configure</text><text x="411" y="345" class="body">Environment variables</text><text x="411" y="374" class="body">Database and services</text>
  <rect x="682" y="254" width="245" height="152" rx="18" class="box"/><text x="716" y="306" class="head">Prepare data</text><text x="716" y="345" class="body">Generate Prisma client</text><text x="716" y="374" class="body">Apply migrations</text>
  <rect x="987" y="254" width="200" height="152" rx="18" class="gold"/><text x="1021" y="306" class="head">Verify</text><text x="1021" y="345" class="body">Tests · build</text><text x="1021" y="374" class="body">Routes · permissions</text>
  <rect x="1247" y="254" width="150" height="152" rx="18" class="green"/><text x="1277" y="306" class="head">Deploy</text><text x="1275" y="345" class="body">Next.js host</text><text x="1275" y="374" class="body">Vercel target</text>
  <path d="M317 330h54" class="line"/><path d="M622 330h54" class="line"/><path d="M927 330h54" class="line"/><path d="M1187 330h50" class="line"/>
  <rect x="255" y="500" width="930" height="105" rx="18" fill="#f9e9e7" stroke="#d7aaa4" stroke-width="2"/><text x="295" y="545" class="head">Not included: automated client export or one-click client deployment</text><text x="295" y="578" class="body">Those are future workflows; this diagram describes application setup only.</text>
  <text x="72" y="690" class="small">External storage, email, anti-spam and monitoring require separate credentials and configuration when enabled.</text>
</svg>
